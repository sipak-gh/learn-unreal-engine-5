; GridSnake - DefaultEngine.ini
; The Blank template writes most of this file; Project Settings edits it for you.
; Lines that the course adds or changes are marked "GridSnake:". If your generated
; file contains extra template lines not shown here, keep them.

[/Script/EngineSettings.GameMapsSettings]
; GridSnake (ch01): Project Settings > Project > Maps & Modes
GameDefaultMap=/Game/GridSnake/Maps/L_Level01.L_Level01
EditorStartupMap=/Game/GridSnake/Maps/L_Level01.L_Level01
; GridSnake (ch02): Default GameMode
GlobalDefaultGameMode=/Game/GridSnake/Blueprints/BP_GSGameMode.BP_GSGameMode_C
; GridSnake (ch03): Game Instance Class
GameInstanceClass=/Script/GridSnake.GSGameInstance

[/Script/Engine.RendererSettings]
; GridSnake (ch04): Project Settings > Engine > Rendering, tuned for unlit pixel art.
; Lumen, distance fields and virtual shadow maps do nothing for flat sprites.
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
; Auto exposure would brighten/darken the sprites as the view changes.
r.DefaultFeature.AutoExposure=False
; Bloom and motion blur smear pixel edges.
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
; Anti-aliasing blurs pixel art; 0 = None.
r.AntiAliasingMethod=0

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum
