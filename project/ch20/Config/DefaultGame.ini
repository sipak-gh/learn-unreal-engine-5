; GridSnake - DefaultGame.ini
; The template also writes a ProjectID=<GUID> line here; keep yours.

[/Script/EngineSettings.GeneralProjectSettings]
; GridSnake (ch01): Project Settings > Project > Description
ProjectName=GridSnake
Description=A grid-based 2D snake game built with Paper2D - course project for "Learn Unreal Engine 5".
CopyrightNotice=GridSnake - course project for "Learn Unreal Engine 5".
ProjectVersion=1.0.0
; GridSnake (ch20): bump before every build you hand out; the main menu shows it.

[/Script/GridSnake.GSSettings]
; GridSnake (ch03): Project Settings > Game > GridSnake. Written when you change a value
; there (DefaultConfig); the C++ defaults apply until then.
GemsPerLevel=3
DefaultStepInterval=0.150000
PointsPerGem=100
; GridSnake (ch13)
LevelList=/Game/GridSnake/Data/DA_LevelList.DA_LevelList
; GridSnake (ch16)
MainMenuMap=/Game/GridSnake/Maps/L_MainMenu.L_MainMenu
; GridSnake (ch17)
Music=/Game/GridSnake/Audio/MSS_Music.MSS_Music
VolumeMix=/Game/GridSnake/Audio/SMix_Volumes.SMix_Volumes
MusicClass=/Game/GridSnake/Audio/SC_Music.SC_Music
SfxClass=/Game/GridSnake/Audio/SC_SFX.SC_SFX

[/Script/UnrealEd.ProjectPackagingSettings]
; GridSnake (ch20): Project Settings > Project > Packaging.
; Shipping removes logging, stats, console and cheats; use Development for test builds.
BuildConfiguration=PPBC_Shipping
; The maps the cooker starts from. Anything they reference is cooked too.
+MapsToCook=(FilePath="/Game/GridSnake/Maps/L_MainMenu")
+MapsToCook=(FilePath="/Game/GridSnake/Maps/L_Level01")
+MapsToCook=(FilePath="/Game/GridSnake/Maps/L_Level02")
+MapsToCook=(FilePath="/Game/GridSnake/Maps/L_Level03")
; Assets only reached through config soft references (GSSettings) or the level list
; are not found by following map references, so always cook these folders.
+DirectoriesToAlwaysCook=(Path="/Game/GridSnake/Data")
+DirectoriesToAlwaysCook=(Path="/Game/GridSnake/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/GridSnake/UI")
; One pak/IoStore container for the whole game.
UsePakFile=True
bUseIoStore=True
IncludeDebugFiles=False
ForDistribution=False
